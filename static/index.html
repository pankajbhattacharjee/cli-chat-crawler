<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crawl Console – CLI-driven AI chat</title>
<style>
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1b2326; --muted:#5d696d; --line:#d9dedc;
  --accent:#0f5f73; --accent-ink:#ffffff; --user:#e3eef1;
  --ok:#17693a; --ok-bg:#e0f2e7; --warn:#8a5a00; --warn-bg:#fcefd0; --bad:#9b1c1c; --bad-bg:#fbe1e1;
  --info:#33415c; --info-bg:#e5e9f2; --code:#10181b; --code-ink:#d6e4e8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121719; --panel:#1a2124; --ink:#e4ecee; --muted:#93a2a7; --line:#2b3539;
  --accent:#4fb3cc; --accent-ink:#06222a; --user:#1f3238;
  --ok:#6fd397; --ok-bg:#16301f; --warn:#f0c15a; --warn-bg:#3a2f10; --bad:#f19090; --bad-bg:#3b1a1a;
  --info:#a9b8d8; --info-bg:#222a3b; --code:#0b1012; --code-ink:#cfe0e5;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.1px}
#mode{font-size:13px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:22px 16px 8px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{max-width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);max-width:80%;white-space:pre-wrap}
.text{white-space:pre-wrap}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;margin-bottom:8px}
.badge.success{background:var(--ok-bg);color:var(--ok)}
.badge.partial,.badge.running{background:var(--warn-bg);color:var(--warn)}
.badge.failed,.badge.rejected,.badge.cancelled{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--info-bg);color:var(--info)}
.progress{color:var(--muted);font-size:14px;margin:4px 0}
.progress::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
.done .progress::before{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.progress::before{animation:none}}
details{margin-top:10px;border:1px solid var(--line);border-radius:8px}
details>summary{cursor:pointer;padding:8px 12px;font-size:14px;color:var(--muted);user-select:none}
details[open]>summary{border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;padding:10px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
pre,code{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace}
pre{margin:0;background:var(--code);color:var(--code-ink);padding:12px;font-size:12.5px;line-height:1.45;overflow:auto;max-height:340px;border-radius:0 0 8px 8px;white-space:pre-wrap;word-break:break-word}
pre.cmd{border-radius:6px;margin:0 12px 10px;max-height:none}
.actions{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
button{font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:13.5px;text-align:left}
footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
form{max-width:860px;margin:0 auto;display:flex;gap:10px}
textarea{flex:1;resize:none;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:46px;max-height:140px}
.note{max-width:860px;margin:6px auto 0;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>Crawl Console</h1><span id="mode">checking backend…</span></header>
<main id="main"><div class="wrap" id="chat">
  <div class="msg">
    <div class="text">Ask me to crawl a public website. I’ll run a real crawler CLI on the server, then give you a summary and the extracted data as JSON.</div>
    <div class="chips" style="margin-top:10px" id="chips"></div>
  </div>
</div></main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="e.g. Crawl https://example.com, summarise it and return JSON" aria-label="Message"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
  <div class="note">Only public sites are crawled. robots.txt is respected; limits apply to pages, depth and time.</div>
</footer>
<script>
const $ = (s, el = document) => el.querySelector(s);
const chat = $("#chat"), input = $("#input"), send = $("#send");
const history = [];
let busy = false;

const EXAMPLES = [
  "Crawl https://example.com, extract the important information, give me a summary, and return the extracted data in JSON format.",
  "Summarise https://books.toscrape.com (max 10 pages)",
  "Crawl http://127.0.0.1 and show me what you find",
  "Crawl https://this-domain-does-not-exist-xyz.com"
];
for (const t of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = t.length > 70 ? t.slice(0, 67) + "…" : t; b.title = t;
  b.onclick = () => { input.value = t; input.focus(); };
  $("#chips").append(b);
}

fetch("/api/health").then(r => r.json()).then(h => {
  $("#mode").textContent = h.llm_mode === "rules"
    ? "No API key: rule-based intent + sitecrawl CLI"
    : `${h.llm_mode} (${h.model}) + sitecrawl CLI`;
}).catch(() => { $("#mode").textContent = "backend unreachable"; });

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function scroll() { $("#main").scrollTop = $("#main").scrollHeight; }

function addUser(text) {
  chat.append(el("div", "msg user", text)); scroll();
}

function addAssistant() {
  const box = el("div", "msg");
  const badge = el("div", "badge running", "running");
  const progress = el("div", "progress", "Starting…");
  const cancel = el("button", "", "Cancel crawl"); cancel.type = "button"; cancel.hidden = true;
  const live = el("details"); live.hidden = true;
  const ls = el("summary", "", "Live crawler output"); const lp = el("pre"); live.append(ls, lp);
  const text = el("div", "text");
  const rest = el("div");
  box.append(badge, progress, cancel, live, text, rest);
  chat.append(box); scroll();
  return { box, badge, progress, cancel, live, lp, text, rest };
}

function kv(rows) {
  const dl = el("dl", "kv");
  for (const [k, v] of rows) { dl.append(el("dt", "", k), el("dd", "", String(v))); }
  return dl;
}

function renderDetails(ui, r) {
  if (r.plan) {
    const d = el("details"); d.append(el("summary", "", "Interpreted task"));
    d.append(kv([["Tool", r.plan.tool], ["URL", r.plan.url], ["Max pages", r.plan.max_pages],
      ["Depth", r.plan.depth], ["Intent from", r.intent_source || "-"],
      ["Summary from", r.summary_source || "-"],
      ...(r.plan.adjustments?.length ? [["Adjusted", r.plan.adjustments.join("; ")]] : []),
      ...(r.llm_note ? [["Note", r.llm_note]] : [])]));
    ui.rest.append(d);
  }
  if (r.execution) {
    const x = r.execution, d = el("details"); d.append(el("summary", "", "Execution details"));
    d.append(kv([["Exit code", x.exit_code], ["Duration", x.duration_sec + " s"],
      ["Timed out", x.timed_out ? "yes" : "no"], ["Cancelled", x.cancelled ? "yes" : "no"]]));
    d.append(el("pre", "cmd", x.command));
    if (x.stderr) { d.append(el("pre", "", "stderr:\n" + x.stderr)); }
    ui.rest.append(d);
  }
  if (r.storage?.enabled) {
    const d = el("details"); d.append(el("summary", "", "Storage"));
    d.append(kv([["S3 upload", r.storage.uploaded ? "ok" : "failed"],
                 ["Location", r.storage.s3_uri || "-"],
                 ...(r.storage.error ? [["Error", r.storage.error]] : [])]));
    ui.rest.append(d);
  }
  if (r.data) {
    const json = JSON.stringify(r.data, null, 2);
    const d = el("details"); d.open = r.status !== "failed"; d.append(el("summary", "", "Extracted data (JSON)"));
    const bar = el("div", "actions");
    const copy = el("button", "", "Copy"); copy.type = "button";
    copy.onclick = async () => { try { await navigator.clipboard.writeText(json); copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1500); } catch { copy.textContent = "Copy failed"; } };
    const dl = el("button", "", "Download .json"); dl.type = "button";
    dl.onclick = () => { const a = el("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = "crawl-result.json"; a.click(); URL.revokeObjectURL(a.href); };
    bar.append(copy, dl);
    d.append(bar, el("pre", "", json));
    ui.rest.append(d);
  }
}

async function sendMessage(text) {
  busy = true; send.disabled = true;
  addUser(text); history.push({ role: "user", content: text });
  const ui = addAssistant();
  let runId = null, finalText = "";
  ui.cancel.onclick = () => { if (runId) fetch("/api/cancel/" + runId, { method: "POST" }); ui.cancel.disabled = true; };
  try {
    const resp = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-12) }) });
    if (!resp.ok) throw new Error(resp.status === 429 ? "Too many requests. Wait a minute and retry." : "Server error " + resp.status);
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const e = JSON.parse(line);
        if (e.type === "status") ui.progress.textContent = e.message;
        else if (e.type === "run") { runId = e.run_id; ui.cancel.hidden = false; ui.live.hidden = false; ui.live.open = true; }
        else if (e.type === "log") { ui.lp.textContent += e.line + "\n"; ui.lp.scrollTop = ui.lp.scrollHeight; scroll(); }
        else if (e.type === "result") {
          ui.box.classList.add("done"); ui.progress.remove(); ui.cancel.remove();
          ui.badge.className = "badge " + e.status;
          ui.badge.textContent = { success: "Completed", partial: "Partial result", failed: "Failed", rejected: "Not run", cancelled: "Cancelled", info: "Reply" }[e.status] || e.status;
          ui.text.textContent = e.message; finalText = e.message;
          renderDetails(ui, e);
        }
      }
    }
    if (!finalText) throw new Error("The server closed the stream without a result.");
  } catch (err) {
    ui.box.classList.add("done"); ui.progress.remove(); ui.cancel.remove();
    ui.badge.className = "badge failed"; ui.badge.textContent = "Error";
    ui.text.textContent = err.message; finalText = err.message;
  }
  history.push({ role: "assistant", content: finalText || "(no result)" });
  busy = false; send.disabled = false; input.focus(); scroll();
}

$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t || busy) return;
  input.value = ""; input.style.height = "";
  sendMessage(t);
});
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });
</script>
</body>
</html>
